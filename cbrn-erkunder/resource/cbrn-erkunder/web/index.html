<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>CBRN Erkunder – Bordcomputer</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Segoe UI,Arial,sans-serif}
  /* Zentrierung per Flex (ganze Pixel) – kein translate/scale, damit die Schrift scharf bleibt */
  #root{position:fixed;inset:0;display:none;align-items:center;justify-content:center}
  #root.on{display:flex}
  #wrap{position:relative;flex:none;border-radius:16px;background:linear-gradient(160deg,#34383e 0%,#1e2125 38%,#14161a 100%);
    box-shadow:0 0 0 1px #0a0b0d,0 0 0 2px #3c4046 inset,0 1px 0 2px #4a4f56 inset,0 30px 70px rgba(0,0,0,.65),0 6px 18px rgba(0,0,0,.5)}
  #screen{position:absolute;overflow:hidden;background:#0b0b0b;border-radius:3px;box-shadow:0 0 0 2px #050607,0 0 0 3px #2a2d32,0 0 22px rgba(0,0,0,.9) inset}
  iframe{position:absolute;left:0;top:0;border:0;display:block;background:#0b0b0b}
  #glare{position:absolute;pointer-events:none;border-radius:3px;background:linear-gradient(115deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,0) 32%)}
  #led{position:absolute;width:6px;height:6px;border-radius:50%;background:#3fb950;box-shadow:0 0 8px #3fb950,0 0 2px #fff inset}
  #brand{position:absolute;left:0;right:0;text-align:center;color:#9aa0a8;font-size:15px;letter-spacing:.2em;font-weight:900;font-family:'Arial Black',Impact,'Segoe UI Black','Segoe UI',Arial,sans-serif;text-transform:uppercase;text-shadow:0 1px 0 #000}
  /* Interaktions-Pin am Weltpunkt: Kreis mit Taste, in Reichweite mit Textschild und Halte-Fortschritt */
  #pin{position:fixed;left:0;top:0;display:none;pointer-events:none;z-index:6;will-change:transform}
  #pin.on{display:block}
  #pinc{position:relative;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;box-sizing:border-box;border:2px solid rgba(240,80,10,.85);background:rgba(10,10,10,.78);display:flex;align-items:center;justify-content:center;color:#fff;font:700 15px/1 'Segoe UI',Arial,sans-serif;box-shadow:0 0 8px rgba(0,0,0,.7);transition:transform .12s,border-color .12s;opacity:.9}
  #pin.near #pinc{transform:scale(1.12);border-color:#f0500a;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 0 12px rgba(240,80,10,.45);opacity:1}
  #pinr{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(#f0500a calc(var(--p,0) * 1%),transparent 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));display:none}
  #pin.hold #pinr{display:block}
  #pinl{position:absolute;left:30px;top:0;transform:translateY(-50%);white-space:nowrap;background:rgba(12,12,12,.94);color:#ebe9e6;padding:6px 12px 6px 11px;border-radius:5px;border:1px solid #2a2a2a;border-left:3px solid #f0500a;font:600 13px/1.2 'Segoe UI',Arial,sans-serif;box-shadow:0 2px 12px rgba(0,0,0,.6);display:none}
  #pinl b{color:#ff8a52;font-weight:800}
  #pin.near #pinl{display:block}
  /* HUD unten rechts (Probenentnahme, Offset Finder) – unabhängig vom Computer, ohne Fokus */
  #hud{position:fixed;right:28px;bottom:28px;width:350px;display:none;background:rgba(14,14,14,.94);border:1px solid #2a2a2a;border-left:3px solid #f0500a;border-radius:8px;color:#ebe9e6;font-size:13px;line-height:1.45;box-shadow:0 8px 28px rgba(0,0,0,.55);padding:12px 14px;pointer-events:none}
  #hud.on{display:block}
  #hud .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#f0500a;font-weight:700;margin-bottom:6px}
  #hud .sub{color:#9a9792;font-size:12px}
  #hud .row{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
  #hud .key{flex:none;min-width:22px;text-align:center;padding:1px 6px;border:1px solid #5a5a5a;border-bottom-width:2px;border-radius:4px;font-family:Consolas,monospace;font-weight:700;background:#1c1c1c}
  #hud .key.act{border-color:#f0500a;color:#ff8a52}
  #hud .dim{opacity:.5}
  #hud .bar{margin-top:10px;height:8px;border-radius:5px;background:#222;overflow:hidden;border:1px solid #333}
  #hud .bar i{display:block;height:100%;background:#f0500a;width:0}
  #hud .pct{margin-top:6px;font-family:Consolas,monospace;font-size:12px;color:#ebe9e6}
  #hud .mono{font-family:Consolas,monospace}
  #hint{position:absolute;left:0;right:0;text-align:center;color:#d5dde6;font-size:12px;text-shadow:0 1px 3px #000}
</style></head>
<body>
<div id="pin"><div id="pinc"><span id="pinr"></span><span id="pink">J</span></div><div id="pinl"></div></div>
<div id="hud"></div>
<div id="root"><div id="wrap">
  <div id="screen"><iframe id="f" src="../app/index.html" allow="clipboard-write"></iframe></div>
  <div id="glare"></div><div id="led"></div><div id="brand">WINTER&nbsp;SYSTEMS</div><div id="hint">ESC – Computer schließen</div>
</div></div>
<script>
  const root = document.getElementById('root'), wrap = document.getElementById('wrap'), f = document.getElementById('f'), screen = document.getElementById('screen');
  const glare = document.getElementById('glare'), led = document.getElementById('led'), brand = document.getElementById('brand'), hint = document.getElementById('hint');
  const res = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'cbrn-erkunder';
  const post = (name, body) => fetch(`https://${res}/${name}`, { method: 'POST', body: JSON.stringify(body || {}) }).catch(() => {});

  // ---- Interaktions-Pin am Weltpunkt
  const pin = document.getElementById('pin'), pinl = document.getElementById('pinl'), pink = document.getElementById('pink'), pinr = document.getElementById('pinr');
  const showPin = (d) => {
    if (!d || !d.show) { pin.classList.remove('on', 'near', 'hold'); return; }
    pin.classList.add('on'); pin.classList.toggle('near', !!d.near); pin.classList.toggle('hold', (d.pct || 0) > 0);
    pin.style.transform = `translate(${Math.round(d.x * innerWidth)}px,${Math.round(d.y * innerHeight)}px)`;
    if (pink.textContent !== d.key) pink.textContent = d.key;
    if (d.near) { const t = d.text ? `Halte <b>${esc(d.key)}</b> gedrückt: ${esc(d.text)}` : ''; if (pinl.dataset.t !== t) { pinl.innerHTML = t; pinl.dataset.t = t; } pinl.style.display = d.text ? 'block' : 'none'; }
    pinr.style.setProperty('--p', d.pct || 0);
  };
  // ---- HUD (unten rechts)
  const hudEl = document.getElementById('hud');
  const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const showHud = (d) => {
    if (!d || d.mode === 'off') { hudEl.classList.remove('on'); hudEl.innerHTML = ''; return; }
    let h = '';
    if (d.mode === 'kit') {
      h = `<div class="t">Probenentnahme</div><div>Probenentnahmeset</div>` +
        (d.atPoint ? `<div class="row"><span class="key act">${esc(d.key)}</span><span>Drücke „${esc(d.key)}“, um hier eine Probe zu entnehmen</span></div>`
                   : `<div class="row dim"><span class="key">${esc(d.key)}</span><span>Steige aus, um eine Probe zu entnehmen</span></div>`) +
        `<div class="row"><span class="key">${esc(d.cancelKey === 'BACK' ? '⌫' : d.cancelKey)}</span><span class="sub">Entnahme abbrechen</span></div><div class="row dim"><span class="sub">Set zurückgeben: im Kreis am Fahrzeug J halten</span></div>`;
    } else if (d.mode === 'hold') {
      h = `<div class="t">Probenentnahme</div><div class="row"><span class="key act">${esc(d.key)}</span><span>Halte „${esc(d.key)}“ gedrückt: ${esc(d.text)}</span></div>` +
        (d.pct > 0 ? `<div class="bar"><i style="width:${Math.max(0, Math.min(100, d.pct))}%"></i></div>` : '');
    } else if (d.mode === 'progress') {
      h = `<div class="t">${esc(d.title)}</div><div>${esc(d.text)}</div><div class="bar"><i style="width:${Math.max(0, Math.min(100, d.pct || 0))}%"></i></div><div class="pct">${Math.round(d.pct || 0)} %</div>` +
        (d.cancelKey ? `<div class="row"><span class="key">${esc(d.cancelKey === 'BACK' ? '⌫' : d.cancelKey)}</span><span class="sub">Abbrechen</span></div>` : '');
    } else if (d.mode === 'taken') {
      h = `<div class="t">Probe entnommen</div><div class="mono">${esc(d.id)}</div>${d.label ? `<div class="sub">${esc(d.label)}</div>` : '<div class="sub">noch nicht beschriftet</div>'}` +
        (d.atPoint ? `<div class="row"><span class="key act">${esc(d.key)}</span><span>Probe hier abgeben</span></div>`
                   : `<div class="row dim"><span class="key">${esc(d.key)}</span><span>Bringe die Probe zum Kreis am Fahrzeug und halte dort J gedrückt</span></div>`);
    } else if (d.mode === 'offset') {
      const f = (v) => (Number(v) >= 0 ? ' ' : '') + Number(v).toFixed(3);
      h = `<div class="t">${esc(d.title || 'CBRN Offset Finder')}</div>` +
        `<div class="mono">↑ / ↓ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Y (vorne / hinten)<br>← / → &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;X (rechts / links)<br>Bild ↑ / ↓ &nbsp;Z (oben / unten)<br>SHIFT 0.10 · STRG 0.01<br>ENTER &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Position speichern<br>BACKSPACE Abbrechen</div>` +
        `<div class="mono" style="margin-top:8px;color:#ff8a52">X: ${f(d.x)}<br>Y: ${f(d.y)}<br>Z: ${f(d.z)}</div><div class="sub" style="margin-top:4px">Schritt ${Number(d.step).toFixed(2)} m</div>`;
    }
    hudEl.innerHTML = h; hudEl.classList.add('on');
  };
  const RATIO = 1.66, MIN_W = 1000; // Mindestbreite der Oberfläche in CSS-Pixeln
  const px = (el, o) => Object.entries(o).forEach(([k, v]) => (el.style[k] = Math.round(v) + 'px'));
  // Alles in ganzen Pixeln: Monitorgröße, Bildschirmfläche, Oberfläche (1:1, nur bei sehr kleinem Fenster verkleinert)
  const fit = () => {
    const W = Math.floor(Math.min(innerWidth * 0.94, innerHeight * 0.9 * RATIO)), H = Math.floor(W / RATIO);
    px(wrap, { width: W, height: H });
    const sx = W * 0.017, sy = H * 0.023, sw = W - 2 * sx, sh = sw * 9 / 16;
    px(screen, { left: sx, top: sy, width: sw, height: sh }); px(glare, { left: sx, top: sy, width: sw, height: sh });
    const logicalW = Math.max(Math.round(sw), MIN_W), k = Math.round(sw) / logicalW;
    f.style.width = logicalW + 'px'; f.style.height = Math.round(sh / k) + 'px'; f.style.transform = k < 1 ? `scale(${k})` : 'none'; f.style.transformOrigin = '0 0';
    const chinTop = sy + sh, chin = H - chinTop;
    px(led, { left: W - sx - 22, top: chinTop + chin / 2 - 3 }); px(brand, { top: chinTop + chin / 2 - 8 }); px(hint, { top: H + 10 });
  };
  window.addEventListener('resize', fit); fit();
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'open') { root.classList.add('on'); fit(); }
    else if (d.type === 'hud') showHud(d.data);
    else if (d.type === 'pin') showPin(d.data);
    else if (d.type === 'evt') f.contentWindow && f.contentWindow.postMessage({ cbrn: 'evt', data: d.data }, '*'); // Live-Ereignis vom Server
    else if (d.type === 'close') root.classList.remove('on');
    else if (d.type === 'cbrn-vehicle') post('setVehicle', { vehicle: d.vehicle, name: d.name, funktion: d.funktion }); // aus der eingebetteten Web-App nach Anmeldung/Abmeldung
    else if (d.type === 'cbrn-close') post('close'); // ESC aus der eingebetteten Web-App
  });
  // Anfragen der Oberflaeche (iframe) -> Lua-Client -> Server-Skript; Antwort zurueck an den iframe
  window.addEventListener('message', async (e) => {
    const d = e.data; if (!d || d.cbrn !== 'req') return;
    let r; try { r = await (await fetch(`https://${res}/api`, { method: 'POST', body: JSON.stringify({ id: d.id, method: d.method, path: d.path, body: d.body, token: d.token }) })).json(); } catch { r = { status: 0, text: '{"error":"NUI-Verbindung fehlgeschlagen"}' }; }
    f.contentWindow.postMessage({ cbrn: 'res', id: d.id, status: r.status, text: r.text }, '*');
  });
  window.addEventListener('keydown', (e) => e.key === 'Escape' && post('close'));
</script></body></html>
