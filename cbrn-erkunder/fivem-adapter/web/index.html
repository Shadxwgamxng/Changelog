<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>CBRN Erkunder – Bordcomputer</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Segoe UI,Arial,sans-serif}
  #wrap{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:855/527;width:min(94vw,calc(92vh * 855 / 527));filter:drop-shadow(0 20px 40px #000c)}
  #wrap.on{display:block}
  /* Bildschirmfläche des Monitorbilds (in %) */
  #screen{position:absolute;left:4.327%;top:7.021%;width:91.345%;height:86.148%;overflow:hidden;background:#0b0b0b}
  iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;width:1366px;height:794px}
  #frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
  #hint{position:absolute;left:0;right:0;bottom:-26px;text-align:center;color:#d5dde6;font-size:12px;text-shadow:0 1px 3px #000}
</style></head>
<body>
<div id="wrap">
  <div id="screen"><iframe id="f" allow="clipboard-write"></iframe></div>
  <img id="frame" src="monitor.png" alt="">
  <div id="hint">ESC – Computer schließen</div>
</div>
<script>
  const wrap = document.getElementById('wrap'), f = document.getElementById('f'), screen = document.getElementById('screen');
  const res = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'cbrn-erkunder';
  const post = (name, body) => fetch(`https://${res}/${name}`, { method: 'POST', body: JSON.stringify(body || {}) }).catch(() => {});
  const fit = () => { f.style.transform = `scale(${screen.clientWidth / 1366})`; };
  window.addEventListener('resize', fit);
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'open') { if (!f.src || f.dataset.url !== d.url) { f.src = d.url; f.dataset.url = d.url; } wrap.classList.add('on'); fit(); }
    else if (d.type === 'close') wrap.classList.remove('on');
    else if (d.type === 'cbrn-vehicle') post('setVehicle', { vehicle: d.vehicle }); // aus der eingebetteten Web-App nach Anmeldung/Abmeldung
    else if (d.type === 'cbrn-close') post('close'); // ESC aus der eingebetteten Web-App
  });
  window.addEventListener('keydown', (e) => e.key === 'Escape' && post('close'));
</script></body></html>
