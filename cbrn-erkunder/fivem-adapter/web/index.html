<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>CBRN Erkunder NUI</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:Segoe UI,Arial,sans-serif}
  #wrap{display:none;position:fixed;inset:3vh 3vw;border:1px solid #38465a;background:#0f1318;box-shadow:0 0 40px #000c}
  #wrap.on{display:block}
  iframe{width:100%;height:100%;border:0;display:block}
  #x{position:absolute;right:-1px;top:-30px;height:30px;padding:0 14px;background:#1c242d;color:#d5dde6;border:1px solid #38465a;cursor:pointer;font-size:13px}
  #x:hover{background:#d0503f}
</style></head>
<body>
<div id="wrap"><button id="x">✕ Schließen (ESC)</button><iframe id="f" allow="clipboard-write"></iframe></div>
<script>
  const wrap = document.getElementById('wrap'), f = document.getElementById('f');
  const res = typeof GetParentResourceName === 'function' ? GetParentResourceName() : 'cbrn-erkunder';
  const close = () => fetch(`https://${res}/close`, { method: 'POST', body: '{}' });
  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type === 'open') { if (!f.src || f.dataset.url !== d.url) { f.src = d.url; f.dataset.url = d.url; } wrap.classList.add('on'); }
    else if (d.type === 'close') wrap.classList.remove('on');
    else if (d.type === 'cbrn-close') close(); // ESC aus der eingebetteten Web-App
  });
  document.getElementById('x').onclick = close;
  window.addEventListener('keydown', (e) => e.key === 'Escape' && close());
</script></body></html>
