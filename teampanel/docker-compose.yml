# Lokale Entwicklungsdatenbank:   docker compose up -d db
# Komplettes Deployment (App+DB): docker compose --profile app up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: panel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-panel}
      POSTGRES_DB: shak_panel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panel -d shak_panel"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://panel:${POSTGRES_PASSWORD:-panel}@db:5432/shak_panel?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Berlin}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INITIAL_SUPERADMIN_EMAIL: ${INITIAL_SUPERADMIN_EMAIL:-}
      INITIAL_SUPERADMIN_USERNAME: ${INITIAL_SUPERADMIN_USERNAME:-}
      INITIAL_SUPERADMIN_PASSWORD: ${INITIAL_SUPERADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  dbdata:
  uploads:
